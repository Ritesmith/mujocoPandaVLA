[pytest]
# The ROS Jazzy pytest plugins (launch_testing, launch_ros, ament_*) registered
# via setuptools entry points fail to import in this environment (missing
# transitive deps: lark, jinja2, typeguard, ...). Disable them so pytest can
# collect and run the auto_iter test suite. They can be re-enabled by installing
# the missing ROS dependencies.
addopts = -p no:launch_testing -p no:launch_ros -p no:ament_copyright -p no:ament_lint -p no:ament_pep257 -p no:ament_flake8 -p no:ament_xmllint
testpaths = auto_iter/tests
